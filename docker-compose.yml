services:
  redis:
    image: redis:7
    container_name: job-queue-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      target: development

    container_name: job-queue-api

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # The server entry point also starts the background worker.
