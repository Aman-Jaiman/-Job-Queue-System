name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Integration Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Pre-flight Env Validation Test
        run: npm run check-env
        env:
          NODE_ENV: test
          PORT: 3000
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: super-secret-test-key-must-be-at-least-32-chars-long
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: "$2b$12$abcdefghijklmnopqrstuv"
          MAIL_HOST: smtp.example.com
          MAIL_PORT: 587
          MAIL_USER: mailer@example.com
          MAIL_PASS: secret-password

      - name: Run Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: super-secret-test-key-must-be-at-least-32-chars-long
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: "$2b$12$abcdefghijklmnopqrstuv"
          MAIL_HOST: smtp.example.com
          MAIL_PORT: 587
          MAIL_USER: mailer@example.com
          MAIL_PASS: secret-password

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: job-queue-system:latest
