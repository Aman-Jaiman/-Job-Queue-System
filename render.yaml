services:
  # 1. Express API Web Service
  - type: web
    name: job-queue-api
    runtime: docker
    region: oregon
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: job-queue-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false

  # 2. Managed Redis Instance
  - type: keyvalue
    name: job-queue-redis
    region: oregon
    plan: starter
    ipAllowList: [] # internal access only
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
