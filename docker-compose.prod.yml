services:
  redis:
    image: redis:7-alpine
    container_name: job-queue-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
      '

    env_file:
      - .env

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    healthcheck:
      test: >
        sh -c '
          if [ -n "$REDIS_PASSWORD" ]; then
            redis-cli -a "$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
        '
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: job-queue-api
    restart: unless-stopped
    init: true
    stop_grace_period: 35s

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: npm start

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: job-queue-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 35s

    depends_on:
      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: npm run worker

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M

volumes:
  redis_data:
