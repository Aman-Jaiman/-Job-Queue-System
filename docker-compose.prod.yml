services:
  redis:
    image: redis:7-alpine
    container_name: job-queue-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: job-queue-api
    restart: unless-stopped
    init: true
    stop_grace_period: 35s

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: npm start

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: job-queue-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 35s

    depends_on:
      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379

    command: npm run worker

volumes:
  redis_data:
